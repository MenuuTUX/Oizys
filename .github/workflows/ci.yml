name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Apple Silicon. Base.xcconfig pins ARCHS=arm64 and -mcpu=apple-m1, and the encoder
    # uses ARM CRC32 and NEON intrinsics, so an Intel runner cannot build this at all.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      # Drives libOizysCore.dylib through ctypes. Nothing here needs a dock, a display or
      # Screen Recording permission; the hardware paths are covered by mock device
      # discovery and real subprocesses. See Documentation/Testing.md for what that
      # leaves untested.
      - name: Unit and property tests
        run: python3 Tools/test.py
      - name: Undefined-behaviour sanitiser
        run: python3 Tools/test.py --sanitize undefined
      - name: Address sanitiser
        run: python3 Tools/test.py --sanitize address
      # pipefail, or the pipe into tee reports tee's exit status and a suite that
      # segfaulted mid-run lands here as a green tick attached to a report of zeroes.
      # --coverage-floor is the second half of the same guard: a crashed interpreter
      # writes no counters, and 0.00% has to fail rather than read as a regression.
      - name: Coverage
        shell: bash
        run: |
          set -o pipefail
          python3 Tools/test.py --coverage --coverage-floor 80 | tee coverage.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.txt
            build/coverage/summary.json
            build/coverage/html
            build/coverage/python.json
            build/coverage/python-html
            build/coverage/build-*.log

  variants:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [debug-minimal, debug-verbose, debug-fallback, production, production-fallback]
    steps:
      - uses: actions/checkout@v5
      # build_app.py re-reads `oizys build-info` out of the binary it just built and
      # refuses to package a bundle whose compiled-in policy disagrees with the variant
      # name. A production build that still had diagnostics in it fails here, not on a
      # trader's machine.
      - name: Build ${{ matrix.variant }}
        run: python3 Tools/build_app.py --variant ${{ matrix.variant }}
