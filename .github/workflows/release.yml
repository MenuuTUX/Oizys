name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo 'Invalid release version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require distribution credentials
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APP_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_PASSWORD }}
          APP_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in APP_P12 APP_PASSWORD INSTALLER_P12 INSTALLER_PASSWORD APP_IDENTITY INSTALLER_IDENTITY NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER; do
            [[ -n "${!name}" ]] || { echo "Missing release credential: $name"; exit 1; }
          done
          [[ "$APP_IDENTITY" == 'Developer ID Application:'* ]] || { echo 'Expected a Developer ID Application identity'; exit 1; }
          [[ "$INSTALLER_IDENTITY" == 'Developer ID Installer:'* ]] || { echo 'Expected a Developer ID Installer identity'; exit 1; }
          keychain="$RUNNER_TEMP/oizys-release.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security import "$RUNNER_TEMP/application.p12" -k "$keychain" -P "$APP_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$INSTALLER_PASSWORD" -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          {
            echo "KEYCHAIN=$keychain"
            echo "APP_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Test
        run: |
          python3 Tools/make_xcodeproj.py
          python3 Tools/test.py

      - name: Build, notarize, and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for variant in production production-fallback debug-minimal debug-verbose debug-fallback; do
            python3 Tools/build_app.py --variant "$variant" --version "$VERSION" --sign "$APP_IDENTITY" --distribution --format app
            case "$variant" in production*) app=Oizys.app ;; *) app=Oizys-debug.app ;; esac
            bundle="build/apps/$variant/$VERSION/$app"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            if [[ "$variant" == debug-verbose ]]; then
              "$bundle/Contents/MacOS/Oizys-debug" --render-preview "$RUNNER_TEMP/oizys-ui-preview"
              for image in popover.png popover-permission.png popover-recovering.png window.png; do
                test -s "$RUNNER_TEMP/oizys-ui-preview/$image"
              done
            fi
            upload="$RUNNER_TEMP/$variant-app.zip"
            ditto -c -k --keepParent "$bundle" "$upload"
            python3 Tools/notarize_release.py "$upload" --staple "$bundle" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            spctl --assess --type execute --verbose=2 "$bundle"
            if [[ "$variant" == production* ]]; then
              python3 Tools/build_app.py --variant "$variant" --version "$VERSION" --sign "$APP_IDENTITY" \
                --package-staged --format both --installer-sign "$INSTALLER_IDENTITY" --installer-keychain "$KEYCHAIN"
              pkg="dist/Oizys-$VERSION-$variant.pkg"
              pkgutil --check-signature "$pkg"
              python3 Tools/notarize_release.py "$pkg" --staple "$pkg" \
                --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            else
              python3 Tools/build_app.py --variant "$variant" --version "$VERSION" --sign "$APP_IDENTITY" \
                --package-staged --format portable
              executable="dist/Oizys-debug-$VERSION-$variant"
              codesign --verify --strict --verbose=2 "$executable"
              upload="$RUNNER_TEMP/$variant-portable.zip"
              ditto -c -k --keepParent "$executable" "$upload"
              python3 Tools/notarize_release.py "$upload" \
                --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            fi
            python3 Tools/make_dmg.py "$variant" --version "$VERSION" --output dist --distribution
            case "$variant" in
              production) dmg="dist/Oizys-$VERSION.dmg" ;;
              production-fallback) dmg="dist/Oizys-$VERSION-production-fallback.dmg" ;;
              debug-verbose) dmg="dist/Oizys-debug-$VERSION.dmg" ;;
              *) dmg="dist/Oizys-debug-$VERSION-$variant.dmg" ;;
            esac
            hdiutil verify "$dmg"
            python3 Tools/notarize_release.py "$dmg" --staple "$dmg" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          done
          (cd dist && shasum -a 256 Oizys-* > SHA256SUMS.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Oizys $VERSION" \
            --notes-file - <<'NOTES'
          All five variants are Developer ID signed and notarized. Each DMG and PKG has a
          stapled Apple notary ticket. The production ZIP contains a stapled app.

          Use `Oizys-<version>.dmg` for the standard app. The
          `production-fallback` image restores DisplayLink Manager if the driver stops.
          Debug images contain portable tools and do not install a login item.

          CI covers software tests and package signatures. No GitHub runner has a DL-6950
          dock attached, so check both physical panels after installing and reconnecting.
          NOTES

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/notary.p8"
          if [[ -f "$RUNNER_TEMP/oizys-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/oizys-release.keychain-db"
          fi
