name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release that ships an untested build is worse than no release.
      - run: python3 Tools/make_xcodeproj.py
      - run: python3 Tools/test.py

      - name: Build and package every variant
        run: |
          set -euo pipefail
          mkdir -p dist
          for variant in production production-fallback debug-verbose debug-fallback debug-minimal; do
            format=portable
            case "$variant" in production*) format=both ;; esac
            python3 Tools/build_app.py --variant "$variant" --version "${{ steps.version.outputs.version }}" --format "$format"
          done
          # Disk images are the drag-to-Applications route; the ZIP and PKG stay for
          # scripted installs. make_dmg reads what build_app already produced.
          python3 Tools/make_dmg.py --output dist
          cd dist && shasum -a 256 Oizys-* Oizys-debug-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --title "Oizys ${{ steps.version.outputs.version }}" \
            --notes-file - <<'NOTES'
          ## Which build to take

          | Build | Diagnostics | Verbose log | Falls back to DisplayLink |
          | --- | --- | --- | --- |
          | `production` | no | no | no |
          | `production-fallback` | no | no | yes |
          | `debug-minimal` | yes | no | no |
          | `debug-verbose` | yes | yes | no |
          | `debug-fallback` | yes | yes | yes |

          `production` is the hardened build: profiling zones, frame dumps, the log stream
          and the diagnostics window are compiled out, not merely switched off, and the
          vendor-restart path is gone with them. A small event listener starts capture
          only for a connected dock in an awake login session. Take `production-fallback` on a machine that still needs
          DisplayLink Manager to come back if the driver stops.

          `Oizys-<version>.dmg` is the simplest way in: open it and drag Oizys to
          Applications. `Oizys-debug-<version>.dmg` carries the portable diagnostic
          executable, which installs nothing and owns the dock only while it runs. The ZIP
          and PKG of the same builds are there for scripted installs.

          Production is named `Oizys` and includes the shared CLI/TUI. Debug is a single
          `Oizys-debug-<version>-<variant>` executable, without an installer. It unpacks
          a signed runtime bundle in the user cache, pauses production for the developer
          session and restores it on exit. Python dependencies are prepared on demand.
          Xcode tools are required to compile repository tests. Production ZIP/PKG bundles
          can be registered for login startup with `./dev.sh install`.

          ## Signing

          These bundles are signed ad hoc. macOS will refuse to launch them on another Mac
          without an explicit Gatekeeper override, and they are not notarized. Developer ID
          signing and notarization are unfinished; do not treat this as a distributable
          build for people outside the project.

          ## What the tests here do and do not cover

          CI runs the full suite against `libOizysCore.dylib`. No GitHub runner has a
          DL-6950 dock attached, so nothing in this release has been exercised against real
          USB, real HDMI or real panels by this workflow. Hardware validation is manual and
          recorded in `Documentation/`.
          NOTES
